services:
  postgres:
    image: postgres:16
    container_name: skill_craft_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-skill_craft}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skill-net

  management:
    build:
      context: .
      dockerfile: management/Dockerfile
    container_name: skill_craft_management
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/skill_craft}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - skill-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: skill_craft_gateway
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/skill_craft}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_BASE_URL: http://management:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
      management:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - skill-net

networks:
  skill-net:
    driver: bridge

volumes:
  db_data:
