services:
  postgres:
    image: postgres:16
    container_name: skill_craft_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-skill_craft}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skill-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: skill_craft_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    networks:
      - skill-net

  management:
    build:
      context: .
      dockerfile: management/Dockerfile
    container_name: skill_craft_management
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/skill_craft}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - skill-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: skill_craft_gateway
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/skill_craft}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_BASE_URL: http://management:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      management:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - skill-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: skill_craft_notification
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/skill_craft}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_BASE_URL: http://management:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_PORT: 8084
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      management:
        condition: service_started
    ports:
      - "8084:8084"
    networks:
      - skill-net

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    container_name: skill_craft_billing
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/skill_craft}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_PORT: 8085
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8085:8085"
    networks:
      - skill-net

networks:
  skill-net:
    driver: bridge

volumes:
  db_data:
