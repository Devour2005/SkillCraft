<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<style th:fragment="style">
	:root {
		--bg: #f4f6f8;
		--card: #ffffff;
		--border: #dde2e7;
		--text: #1f2937;
		--muted: #6b7280;
		--primary: #2563eb;
		--primary-dark: #1d4ed8;
		--danger: #dc2626;
		--success: #16a34a;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
		background: var(--bg);
		color: var(--text);
	}
	header.app-header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 16px 24px;
		background: var(--card);
		border-bottom: 1px solid var(--border);
	}
	header.app-header h1 { font-size: 18px; margin: 0; }
	main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
	.auth-box {
		max-width: 380px;
		margin: 80px auto;
		background: var(--card);
		border: 1px solid var(--border);
		border-radius: 10px;
		padding: 32px;
	}
	.auth-box h1 { margin-top: 0; font-size: 20px; text-align: center; }
	label { display: block; margin-bottom: 14px; font-size: 14px; color: var(--muted); }
	input, select, textarea {
		width: 100%;
		margin-top: 4px;
		padding: 9px 10px;
		border: 1px solid var(--border);
		border-radius: 6px;
		font-size: 14px;
	}
	button, .btn {
		display: inline-block;
		background: var(--primary);
		color: #fff;
		border: none;
		border-radius: 6px;
		padding: 9px 16px;
		font-size: 14px;
		cursor: pointer;
		text-decoration: none;
	}
	button:hover, .btn:hover { background: var(--primary-dark); }
	.btn-link { background: none; color: var(--muted); padding: 0; text-decoration: underline; }
	.alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
	.alert.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
	.alert.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
	.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
	.tabs a {
		padding: 10px 16px;
		text-decoration: none;
		color: var(--muted);
		border-bottom: 2px solid transparent;
		font-size: 14px;
	}
	.tabs a.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
	table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
	th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
	th { background: #f9fafb; color: var(--muted); font-weight: 600; }
	tr:last-child td { border-bottom: none; }
	.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; max-width: 480px; }
	.form-actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
	.muted { color: var(--muted); font-size: 13px; }
</style>
</body>
</html>
